<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="button" value="Easy" onclick="setRandom(1)">
    <input type="button" value="Medium" onclick="setRandom(2)">
    <input type="button" value="Hard" onclick="setRandom(3)">

    <script>
        var secret = "";
        function setRandom(level){
            
            while(level > 0){
                let n = (Math.floor(Math.random() * 10));
                console.log(n);
                secret = secret.concat(n);
                
                level --;
            }
            
        }
        function evaluate(){
            if (document.getElementById("guess") < secret){
                const comparestatement = document.getElementById("compare");
                compare.textContent = "Too low!"
            }
            if (document.getElementById("guess") > secret){
                const comparestatement = document.getElementById("compare");
                compare.textContent = "Too high!"
            }
            if (document.getElementById("guess") === secret){
                const comparestatement = document.getElementById("compare");
                compare.textContent = "Correct"
            }
        }
    </script>

    <input type="number" value="guess" id="guess">Guess here</input>
    <input type="button" value="Enter guess" onclick="evaluate()">
    <label id="compare"></label>
    
</body>
</html>
