<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="button" value="Easy" onclick="setRandom(1)">
    <input type="button" value="Medium" onclick="setRandom(2)">
    <input type="button" value="Hard" onclick="setRandom(3)">

    <script>
        var secret = "";
        function setRandom(level){
            secret = ""
            while(level > 0){
                let n = (Math.floor(Math.random() * 10));
                console.log(n);
                secret = secret.concat(n);
                
                level --;
            }
            
        }
        function ehvaluate(){
            const comparestatement = document.getElementById("compare");
            if (Number(document.getElementById("guess").value) < Number(secret)){
                const comparestatement = document.getElementById("compare");
                comparestatement.textContent = "Too low!"
            }
            if (Number(document.getElementById("guess").value) > Number(secret)){
                const comparestatement = document.getElementById("compare");
                comparestatement.textContent = "Too high!"
            }
            if (Number(document.getElementById("guess").value) === Number(secret)){
                const comparestatement = document.getElementById("compare");
                comparestatement.textContent = "Correct"
            }
        }
    </script>

    <input type="number" id="guess"> Guess here
    <input type="button" value="Enter guess" onclick="ehvaluate()">
    <p id="compare"></p>
    
</body>
</html>
